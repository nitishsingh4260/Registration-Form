<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <hr>
    <form>
        <table border = "1" width="100%" cellpadding="10">
            <tr>
                <th colspan="2">
                    <h1>Registration Form</h1>
                </th>
            </tr>
            <tr>
                <td>
                    Student Name
                </td>
                <td>
                    <input type="text" size="35">
                </td>
            </tr>
            <tr>
                <td>Father Name</td>
                <td>
                    <input type="text" size ="35">
                </td>
            </tr>
            <tr>
                <td>Mother Name</td>
                <td>
                    <input type="text" size="35">
                </td>
            </tr>
            <tr>
                <td>Date of birth</td>
                <td>
                    <input type="Date">
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                <input type="radio" value="Male" name="Gender">Male
                <input type="radio" value="Male" name="Gender">Female
                <input type="radio" value="Male" name="Gender">Transgender
                </td>
            </tr>
            <tr>
                <td>Email ID</td>
                <td>
                    <input type="text" size="35">
                </td>
            </tr>
            <tr>
                <td>Mobile no.</td>
                <td>
                    <input type="tel"size="35">
                </td>
            </tr>
            <tr>
                <td>Adress</td>
                <td>
                    <input type="text" size="35">
                </td>
            </tr>
            <tr>
                <td>State</td>
                <td>
                    <input type="text" size="35">
                </td>
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <input type="text " size="35">
                    <input type="Submit">
                </td>
                   
            </tr>
        </table>
    </form>
    
</body>
</html>
